{% extends "base.html" %}

{% block content %}
<section class="content-section">
  <h1>{{ section.title }}</h1>

  <ul class="content-list">
    {% for page in section.pages %}
      <li class="post-item">
        <div>
          <a href="{{ page.permalink }}">{{ page.title }}</a>
          <span class="post-date">{{ page.date | date(format="%m/%Y") }}</span>
        </div>
        <p>{{ page.description }}</p>
      </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
