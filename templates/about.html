{% extends "base.html" %}

{% block structured_data %}
{% set person_id = config.base_url ~ "/#person" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "AboutPage",
      "url": {{ current_url | json_encode | safe }},
      "name": {{ page.title | json_encode | safe }},
      "description": {{ page.description | default(value=config.description) | json_encode | safe }},
      "mainEntity": { "@id": {{ person_id | json_encode | safe }} }
    },
    {
      "@type": "Person",
      "@id": {{ person_id | json_encode | safe }},
      "name": {{ config.extra.author | default(value=config.author) | json_encode | safe }},
      "url": {{ current_url | json_encode | safe }},
      "email": {{ config.extra.email | json_encode | safe }},
      "sameAs": [
        {{ config.extra.github | json_encode | safe }},
        {{ config.extra.linkedin | json_encode | safe }}
      ]
    }
  ]
}
</script>
{% endblock %}

{% block content %}
<article class="page">
  <h1>{{ page.title }}</h1>
  <div class="page-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
